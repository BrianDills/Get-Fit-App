<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1D21;
    --surface: #232529;
    --surface-2: #2B2E33;
    --border: #383B41;
    --chalk: #ECE9E2;
    --muted: #93969D;
    --muted-2: #6D7076;
    --brass: #C98A2B;
    --brass-dim: #8A6423;
    --teal: #3F9C7A;
    --rust: #C1553D;
    --radius: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--chalk);}
  body{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .display{ font-family:'Oswald', 'Arial Narrow', sans-serif; }

  /* ---------- top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .wordmark{
    display:flex; align-items:baseline; gap:10px;
  }
  .wordmark .bar{ color: var(--brass); font-size: 15px; letter-spacing: 2px; }
  .wordmark h1{
    font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:2px; font-size:22px; margin:0; color: var(--chalk);
  }
  .tagline{ color: var(--muted); font-size:12px; margin-top:4px; letter-spacing: 0.3px;}
  .back-row{ display:flex; align-items:center; gap:10px; }
  .back-btn{
    background:none; border:none; color:var(--chalk); font-family:'Oswald',sans-serif;
    font-size:15px; font-weight:600; letter-spacing:1px; display:flex; align-items:center; gap:6px;
    padding: 6px 4px; cursor:pointer;
  }
  .back-btn:active{ opacity:0.6; }

  /* ---------- home ---------- */
  .container{ padding: 16px 16px 8px; max-width: 640px; margin: 0 auto; }
  .day-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px;
    margin-bottom: 12px;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .day-card:active{ background: var(--surface-2); border-color: var(--brass-dim); }
  .day-card .num{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; color: var(--brass);
    width: 34px; flex-shrink:0;
  }
  .day-card .info{ flex:1; min-width:0; }
  .day-card .title{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; font-size:17px;
    text-transform:uppercase; color:var(--chalk);
  }
  .day-card .subtitle{ color: var(--muted); font-size:12px; margin-top:2px; }
  .day-card .status{ color: var(--muted-2); font-size:11px; margin-top:6px; letter-spacing:0.3px;}
  .day-card .status.done{ color: var(--teal); }
  .day-card .chevron{ color: var(--muted-2); font-size:20px; flex-shrink:0; }

  .section-label{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1.5px;
    color: var(--muted); font-size:11px; margin: 18px 4px 8px;
  }

  .reset-row{ text-align:center; margin-top: 28px; }
  .reset-btn{
    background:none; border:none; color:var(--muted-2); font-size:11px;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.5px; padding:10px; cursor:pointer;
    text-decoration: underline;
  }

  /* ---------- log view ---------- */
  .exercise-block{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow:hidden;
  }
  .exercise-head{ padding: 14px 16px 10px; }
  .exercise-name{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:0.3px;
    color: var(--chalk); text-transform:uppercase;
  }
  .superset-tag{
    display:inline-block; margin-left:8px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; color: var(--brass); border:1px solid var(--brass-dim);
    border-radius: 4px; padding: 1px 6px; letter-spacing:0.5px; vertical-align:2px;
  }
  .exercise-note{ color: var(--muted); font-size:12px; font-style:italic; margin-top:3px; }

  .plate-tally{ display:flex; gap:4px; margin-top:10px; }
  .plate-seg{
    height:6px; flex:1; border-radius:3px; background: var(--surface-2);
    border: 1px solid var(--border);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .plate-seg.filled{ background: var(--brass); border-color: var(--brass); }

  .set-row{
    display:grid;
    grid-template-columns: 64px 1fr 74px 74px;
    align-items:center;
    gap:8px;
    padding: 9px 16px;
    border-top: 1px solid var(--border);
  }
  .set-row .set-label{ font-size:12px; color: var(--muted); }
  .set-row .set-label.warmup{ color: var(--muted-2); }
  .set-row .target{ font-size:12px; color: var(--muted); }
  .set-row .target .num{ color: var(--chalk); font-weight:500; }
  .set-row .last-hint{ font-size:10px; color: var(--muted-2); display:block; margin-top:1px; }

  .field{ position:relative; }
  .field input{
    width:100%; background: var(--surface-2); border:1px solid var(--border);
    border-radius:6px; color: var(--chalk); font-family:'IBM Plex Mono',monospace;
    font-size:14px; padding: 8px 6px; text-align:center; -moz-appearance:textfield;
  }
  .field input:focus{ outline:none; border-color: var(--brass); }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field-label{ position:absolute; top:-8px; left:6px; background:var(--surface); padding:0 4px; font-size:8.5px; color:var(--muted-2); letter-spacing:0.5px;}

  .up-arrow{ color: var(--teal); font-size: 11px; margin-left: 3px; }

  .finish-bar{
    position: sticky; bottom:0; z-index: 20;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  .finish-btn{
    width:100%; background: var(--brass); color: #1B1D21; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; font-size:15px; padding: 16px; border-radius: 10px;
    cursor:pointer;
  }
  .finish-btn:active{ background: var(--brass-dim); }

  /* ---------- rest timer bar ---------- */
  .rest-bar{
    position: sticky; bottom:0; z-index: 25;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
  }
  .rest-info{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .rest-label{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:2px; font-size:12px;
    color: var(--muted); text-transform:uppercase;
  }
  .rest-clock{
    font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;
    font-size:28px; font-weight:600; color: var(--chalk); letter-spacing:1px;
  }
  .rest-bar.ending .rest-clock{ color: var(--rust); }
  .rest-progress{
    height:6px; border-radius:3px; background: var(--surface-2); overflow:hidden; margin-bottom:12px;
    border: 1px solid var(--border);
  }
  .rest-progress-fill{
    height:100%; background: var(--brass); width:100%;
    transition: width 1s linear;
  }
  .rest-bar.ending .rest-progress-fill{ background: var(--rust); }
  .rest-controls{ display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap:8px; }
  .rest-controls button{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.5px; font-size:13px;
    border-radius:8px; padding:12px 6px; cursor:pointer; border:1px solid var(--border);
    background: var(--surface-2); color: var(--chalk);
  }
  .rest-controls button:active{ background: var(--border); }
  .rest-controls .rest-skip{ background: var(--brass); color:#1B1D21; border-color: var(--brass); }
  .rest-controls .rest-skip:active{ background: var(--brass-dim); }

  .toast{
    position: fixed; left:50%; bottom: 90px; transform: translateX(-50%);
    background: var(--surface-2); border:1px solid var(--teal); color: var(--chalk);
    padding: 12px 18px; border-radius: 8px; font-size:13px; z-index:50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    animation: toastIn 0.2s ease;
    max-width: 85%; text-align:center;
  }
  @keyframes toastIn{ from{ opacity:0; transform: translateX(-50%) translateY(8px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }

  .empty-note{ color: var(--muted); font-size:12px; text-align:center; padding: 10px 20px 0; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="home-view">
  <div class="topbar">
    <div class="wordmark">
      <span class="bar">&#9473;&#9679;&#9473;</span>
      <h1>Iron Log</h1>
    </div>
    <div class="tagline">30-day upper/lower cycle &middot; progressive overload tracker</div>
  </div>
  <div class="container">
    <div class="section-label">This week's plan</div>
    <div id="day-list"></div>
    <div class="reset-row"><button class="reset-btn" id="reset-btn">clear all logged data</button></div>
  </div>
</div>

<div id="log-view" class="hidden">
  <div class="topbar">
    <div class="back-row">
      <button class="back-btn" id="back-btn">&larr; BACK</button>
    </div>
    <div class="wordmark" style="margin-top:8px;">
      <h1 id="log-title" style="font-size:22px;"></h1>
    </div>
    <div class="tagline" id="log-subtitle"></div>
  </div>
  <div class="container" id="log-body" style="padding-bottom: 100px;"></div>
  <div class="finish-bar" id="finish-bar">
    <button class="finish-btn" id="finish-btn">Finish Workout</button>
  </div>
  <div class="rest-bar hidden" id="rest-bar">
    <div class="rest-info">
      <span class="rest-label">Resting</span>
      <span class="rest-clock" id="rest-clock">01:30</span>
    </div>
    <div class="rest-progress"><div class="rest-progress-fill" id="rest-progress-fill"></div></div>
    <div class="rest-controls">
      <button id="rest-minus">&minus;15s</button>
      <button class="rest-skip" id="rest-skip">Skip Rest</button>
      <button id="rest-plus">+15s</button>
    </div>
  </div>
</div>

<script>
const PROGRAM = [{"id": "d1", "num": 1, "title": "UPPER A", "subtitle": "Push/Pull, Chest Emphasis", "exercises": [{"name": "Flat Dumbbell Bench Press", "notes": "", "superset": "", "sets": [{"type": "warmup", "target": "15"}, {"type": "warmup", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "1-Arm Dumbbell Row", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Seated Dumbbell Overhead Press", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Lateral Raise", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Standing Dumbbell Curl", "notes": "", "superset": "d1_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Overhead Dumbbell Triceps Extension", "notes": "", "superset": "d1_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}]}, {"id": "d2", "num": 2, "title": "LOWER A", "subtitle": "Quad Emphasis", "exercises": [{"name": "Dumbbell Goblet Squat", "notes": "", "superset": "", "sets": [{"type": "warmup", "target": "15"}, {"type": "warmup", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Dumbbell Walking Lunge", "notes": "Reps are per leg", "superset": "", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Dumbbell Romanian Deadlift", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Standing Loaded Dumbbell Calf Raise", "notes": "Hold a dumbbell in each hand", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Weighted Dumbbell Sit-Up", "notes": "Hold dumbbell at chest", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}]}, {"id": "d3", "num": 3, "title": "UPPER B", "subtitle": "Pull/Push, Back Emphasis", "exercises": [{"name": "Incline Dumbbell Row", "notes": "Chest-supported if possible", "superset": "", "sets": [{"type": "warmup", "target": "15"}, {"type": "warmup", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Incline Dumbbell Bench Press", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Pullover", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}]}, {"name": "Bent-Over Dumbbell Rear Delt Fly", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Seated Dumbbell Lateral Raise", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Incline Dumbbell Hammer Curl", "notes": "", "superset": "d3_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Dumbbell Skull Crusher", "notes": "", "superset": "d3_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}]}, {"id": "d4", "num": 4, "title": "LOWER B", "subtitle": "Hamstring/Glute Emphasis", "exercises": [{"name": "Single-Leg Dumbbell Romanian Deadlift", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "warmup", "target": "12"}, {"type": "warmup", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Bulgarian Split Squat", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Hip Thrust", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Seated Loaded Dumbbell Calf Raise", "notes": "Hold a dumbbell on each knee", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Weighted Plank", "notes": "Plate or dumbbell on back", "superset": "", "sets": [{"type": "normal", "target": "30-45 sec"}, {"type": "normal", "target": "30-45 sec"}, {"type": "normal", "target": "30-45 sec"}]}]}, {"id": "d5", "num": 5, "title": "ARMS + WEAK POINTS", "subtitle": "", "exercises": [{"name": "Alternate Dumbbell Curl", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "warmup", "target": "12"}, {"type": "warmup", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Two-Hand Overhead Dumbbell Triceps Extension", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Cross-Body Hammer Curl", "notes": "Alternate sides each rep", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Dumbbell Kickback", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Bent-Over Dumbbell Rear Delt Fly", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}]}, {"name": "Dumbbell Lateral Raise", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}]}, {"name": "Weighted Russian Twist", "notes": "Hold dumbbell with both hands", "superset": "", "sets": [{"type": "normal", "target": "15-20"}, {"type": "normal", "target": "15-20"}, {"type": "normal", "target": "15-20"}]}]}];

let currentDay = null;

function isTimeTarget(t){ return /sec/i.test(t); }
function isNumericTarget(t){ return /^\d+$/.test(t); }

async function getLatest(dayId){
  try{
    const raw = localStorage.getItem('latest:' + dayId);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function fmtDate(iso){
  const d = new Date(iso);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

async function renderHome(){
  const list = document.getElementById('day-list');
  list.innerHTML = '';
  for(const day of PROGRAM){
    const latest = await getLatest(day.id);
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="num">${String(day.num).padStart(2,'0')}</div>
      <div class="info">
        <div class="title">${day.title}</div>
        <div class="subtitle">${day.subtitle || ''}</div>
        <div class="status ${latest ? 'done' : ''}">${latest ? 'Last done ' + fmtDate(latest.date) : 'Not started yet'}</div>
      </div>
      <div class="chevron">&rsaquo;</div>
    `;
    card.addEventListener('click', () => openDay(day.id));
    list.appendChild(card);
  }
}

async function openDay(dayId){
  endRest();
  currentDay = PROGRAM.find(d => d.id === dayId);
  const latest = await getLatest(dayId);
  document.getElementById('log-title').textContent = currentDay.title;
  document.getElementById('log-subtitle').textContent = currentDay.subtitle
    ? currentDay.subtitle + (latest ? ' · last done ' + fmtDate(latest.date) : '')
    : (latest ? 'Last done ' + fmtDate(latest.date) : 'Not started yet');

  const body = document.getElementById('log-body');
  body.innerHTML = '';

  currentDay.exercises.forEach((ex, exIdx) => {
    const block = document.createElement('div');
    block.className = 'exercise-block';
    block.dataset.exIdx = exIdx;

    const head = document.createElement('div');
    head.className = 'exercise-head';
    head.innerHTML = `
      <div class="exercise-name">${ex.name}${ex.superset ? `<span class="superset-tag">SUPERSET</span>` : ''}</div>
      ${ex.notes ? `<div class="exercise-note">${ex.notes}</div>` : ''}
      <div class="plate-tally" id="tally-${exIdx}"></div>
    `;
    block.appendChild(head);

    ex.sets.forEach((s, setIdx) => {
      const prevSet = latest && latest.exercises && latest.exercises[exIdx] ? latest.exercises[exIdx][setIdx] : null;
      const row = document.createElement('div');
      row.className = 'set-row';
      const label = s.type === 'warmup' ? 'Warm-up' : `Set ${ex.sets.slice(0, setIdx+1).filter(x => x.type !== 'warmup').length}`;
      const timeBased = isTimeTarget(s.target);
      const secondLabel = timeBased ? 'SEC' : 'REPS';
      const restSeconds = computeRestSeconds(ex, exIdx, s.type);
      row.innerHTML = `
        <div class="set-label ${s.type === 'warmup' ? 'warmup' : ''}">${label}</div>
        <div class="target">target: <span class="num">${s.target}</span></div>
        <div class="field">
          <span class="field-label">LB</span>
          <input type="number" inputmode="decimal" min="0" step="0.5"
                 data-ex="${exIdx}" data-set="${setIdx}" data-field="weight"
                 placeholder="${prevSet && prevSet.weight != null ? prevSet.weight : '-'}">
        </div>
        <div class="field">
          <span class="field-label">${secondLabel}</span>
          <input type="number" inputmode="numeric" min="0" step="1"
                 data-ex="${exIdx}" data-set="${setIdx}" data-field="reps" data-rest="${restSeconds}"
                 placeholder="${prevSet && prevSet.reps != null ? prevSet.reps : '-'}">
        </div>
      `;
      block.appendChild(row);

      // wire input listener to update plate tally
      const weightInput = row.querySelector('[data-field="weight"]');
      const repsInput = row.querySelector('[data-field="reps"]');
      [weightInput, repsInput].forEach(inp => {
        inp.addEventListener('input', () => updateTally(exIdx));
      });
      // auto-start rest timer once reps are logged for this set
      repsInput.addEventListener('change', () => {
        if(repsInput.value !== ''){
          startRest(restSeconds);
        }
      });
    });

    body.appendChild(block);
    renderTally(exIdx, ex.sets.length);
  });

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('log-view').classList.remove('hidden');
  window.scrollTo(0,0);
}

function renderTally(exIdx, count){
  const tally = document.getElementById('tally-' + exIdx);
  tally.innerHTML = '';
  for(let i=0;i<count;i++){
    const seg = document.createElement('div');
    seg.className = 'plate-seg';
    seg.id = `seg-${exIdx}-${i}`;
    tally.appendChild(seg);
  }
}

function updateTally(exIdx){
  const block = document.querySelector(`.exercise-block[data-ex-idx="${exIdx}"]`);
  if(!block) return;
  const rows = block.querySelectorAll('.set-row');
  rows.forEach((row, setIdx) => {
    const w = row.querySelector('[data-field="weight"]').value;
    const r = row.querySelector('[data-field="reps"]').value;
    const seg = document.getElementById(`seg-${exIdx}-${setIdx}`);
    if(seg){
      if(w !== '' || r !== ''){ seg.classList.add('filled'); }
      else{ seg.classList.remove('filled'); }
    }
  });
}

/* ---------- rest timer ---------- */
let restInterval = null;
let restRemaining = 0;
let restTotal = 0;

function computeRestSeconds(ex, exIdx, setType){
  // supersets: minimal rest, since exercises are meant to be done back-to-back
  if(ex.superset) return 20;
  // warm-up sets: short rest, you're not near failure yet
  if(setType === 'warmup') return 60;
  // the day's first exercise is the primary heavy compound lift: longer rest
  if(exIdx === 0) return 120;
  // everything else: standard hypertrophy-accessory rest
  return 75;
}

function startRest(seconds){
  clearInterval(restInterval);
  restTotal = seconds;
  restRemaining = seconds;
  document.getElementById('finish-bar').classList.add('hidden');
  const bar = document.getElementById('rest-bar');
  bar.classList.remove('hidden');
  bar.classList.remove('ending');
  updateRestUI();
  restInterval = setInterval(() => {
    restRemaining--;
    if(restRemaining <= 0){
      clearInterval(restInterval);
      restRemaining = 0;
      updateRestUI();
      onRestComplete();
      return;
    }
    updateRestUI();
  }, 1000);
}

function updateRestUI(){
  const m = Math.floor(restRemaining / 60).toString().padStart(2,'0');
  const s = (restRemaining % 60).toString().padStart(2,'0');
  document.getElementById('rest-clock').textContent = `${m}:${s}`;
  const pct = restTotal > 0 ? Math.min(100, (restRemaining / restTotal) * 100) : 0;
  document.getElementById('rest-progress-fill').style.width = pct + '%';
  document.getElementById('rest-bar').classList.toggle('ending', restRemaining > 0 && restRemaining <= 5);
}

function endRest(){
  clearInterval(restInterval);
  restInterval = null;
  document.getElementById('rest-bar').classList.add('hidden');
  document.getElementById('finish-bar').classList.remove('hidden');
}

function onRestComplete(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  playBeep();
  setTimeout(endRest, 1400);
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ring = (delay) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.32);
      }, delay);
    };
    ring(0); ring(400);
  }catch(e){}
}

document.getElementById('rest-skip').addEventListener('click', endRest);
document.getElementById('rest-minus').addEventListener('click', () => {
  restRemaining = Math.max(0, restRemaining - 15);
  if(restRemaining === 0){ clearInterval(restInterval); onRestComplete(); }
  else{ updateRestUI(); }
});
document.getElementById('rest-plus').addEventListener('click', () => {
  restRemaining += 15;
  updateRestUI();
});

async function finishWorkout(){
  const body = document.getElementById('log-body');
  const exercisesData = {};
  currentDay.exercises.forEach((ex, exIdx) => {
    const block = body.querySelector(`.exercise-block[data-ex-idx="${exIdx}"]`) || body.children[exIdx];
    const setsData = [];
    ex.sets.forEach((s, setIdx) => {
      const wInput = block.querySelector(`[data-ex="${exIdx}"][data-set="${setIdx}"][data-field="weight"]`);
      const rInput = block.querySelector(`[data-ex="${exIdx}"][data-set="${setIdx}"][data-field="reps"]`);
      const weight = wInput && wInput.value !== '' ? parseFloat(wInput.value) : null;
      const reps = rInput && rInput.value !== '' ? parseFloat(rInput.value) : null;
      setsData.push({ weight, reps });
    });
    exercisesData[exIdx] = setsData;
  });

  const anyData = Object.values(exercisesData).some(sets => sets.some(s => s.weight != null || s.reps != null));
  if(!anyData){
    showToast('Enter at least one set before finishing.');
    return;
  }

  const payload = { date: new Date().toISOString(), exercises: exercisesData };
  try{
    localStorage.setItem('latest:' + currentDay.id, JSON.stringify(payload));
    showToast('Workout saved — nice work.');
    setTimeout(() => { goHome(); }, 650);
  }catch(e){
    showToast('Could not save — try again.');
  }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function goHome(){
  endRest();
  document.getElementById('log-view').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  renderHome();
  window.scrollTo(0,0);
}

document.getElementById('back-btn').addEventListener('click', goHome);
document.getElementById('finish-btn').addEventListener('click', finishWorkout);
document.getElementById('reset-btn').addEventListener('click', async () => {
  if(!confirm('Clear all logged sessions? This cannot be undone.')) return;
  for(const day of PROGRAM){
    try{ localStorage.removeItem('latest:' + day.id); }catch(e){}
  }
  showToast('All data cleared.');
  renderHome();
});

renderHome();
</script>
