<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1D21;
    --surface: #232529;
    --surface-2: #2B2E33;
    --border: #383B41;
    --chalk: #ECE9E2;
    --muted: #93969D;
    --muted-2: #6D7076;
    --brass: #C98A2B;
    --brass-dim: #8A6423;
    --teal: #3F9C7A;
    --rust: #C1553D;
    --radius: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--chalk);}
  body{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .display{ font-family:'Oswald', 'Arial Narrow', sans-serif; }

  /* ---------- top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .wordmark{
    display:flex; align-items:baseline; gap:10px;
  }
  .wordmark .bar{ color: var(--brass); font-size: 15px; letter-spacing: 2px; }
  .wordmark h1{
    font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:2px; font-size:22px; margin:0; color: var(--chalk);
  }
  .tagline{ color: var(--muted); font-size:12px; margin-top:4px; letter-spacing: 0.3px;}
  .back-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back-btn{
    background:none; border:none; color:var(--chalk); font-family:'Oswald',sans-serif;
    font-size:15px; font-weight:600; letter-spacing:1px; display:flex; align-items:center; gap:6px;
    padding: 6px 4px; cursor:pointer;
  }
  .back-btn:active{ opacity:0.6; }
  .edit-toggle-btn{
    background: none; border:1px solid var(--brass-dim); color: var(--brass);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px;
    padding:6px 14px; border-radius:20px; cursor:pointer; text-transform:uppercase;
  }
  .edit-toggle-btn:active{ background: var(--brass-dim); color:#1B1D21; }

  /* ---------- home ---------- */
  .container{ padding: 16px 16px 8px; max-width: 640px; margin: 0 auto; }
  .day-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px;
    margin-bottom: 12px;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .day-card:active{ background: var(--surface-2); border-color: var(--brass-dim); }
  .day-card .num{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; color: var(--brass);
    width: 34px; flex-shrink:0;
  }
  .day-card .info{ flex:1; min-width:0; }
  .day-card .title{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; font-size:17px;
    text-transform:uppercase; color:var(--chalk);
  }
  .day-card .subtitle{ color: var(--muted); font-size:12px; margin-top:2px; }
  .day-card .status{ color: var(--muted-2); font-size:11px; margin-top:6px; letter-spacing:0.3px;}
  .day-card .status.done{ color: var(--teal); }
  .day-card .chevron{ color: var(--muted-2); font-size:20px; flex-shrink:0; }

  .section-label{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1.5px;
    color: var(--muted); font-size:11px; margin: 18px 4px 8px;
  }

  .reset-row{ text-align:center; margin-top: 28px; display:flex; flex-direction:column; gap:10px; }
  .reset-btn{
    background:none; border:none; color:var(--muted-2); font-size:11px;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.5px; padding:6px; cursor:pointer;
    text-decoration: underline;
  }

  /* ---------- log view ---------- */
  .exercise-block{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow:hidden;
  }
  .exercise-head{ padding: 14px 16px 10px; }
  .exercise-name-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .exercise-name{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:0.3px;
    color: var(--chalk); text-transform:uppercase;
  }
  .superset-tag{
    display:inline-block; margin-left:8px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; color: var(--brass); border:1px solid var(--brass-dim);
    border-radius: 4px; padding: 1px 6px; letter-spacing:0.5px; vertical-align:2px;
  }
  .exercise-note{ color: var(--muted); font-size:12px; font-style:italic; margin-top:3px; }

  .remove-exercise-btn{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid var(--rust);
    color: var(--rust); background:none; font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; visibility:hidden;
  }
  #log-view.editing .remove-exercise-btn{ visibility:visible; }
  .remove-exercise-btn:active{ background: var(--rust); color: var(--bg); }

  .plate-tally{ display:flex; gap:4px; margin-top:10px; }
  .plate-seg{
    height:6px; flex:1; border-radius:3px; background: var(--surface-2);
    border: 1px solid var(--border);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .plate-seg.filled{ background: var(--brass); border-color: var(--brass); }

  .set-row{
    display:grid;
    grid-template-columns: 54px 1fr 66px 66px 22px;
    align-items:center;
    gap:6px;
    padding: 9px 16px;
    border-top: 1px solid var(--border);
  }
  .set-row .set-label{ font-size:12px; color: var(--muted); }
  .set-row .set-label.warmup{ color: var(--muted-2); }
  .set-row .target{ font-size:12px; color: var(--muted); }
  .set-row .target .num{ color: var(--chalk); font-weight:500; }

  .field{ position:relative; }
  .field input{
    width:100%; background: var(--surface-2); border:1px solid var(--border);
    border-radius:6px; color: var(--chalk); font-family:'IBM Plex Mono',monospace;
    font-size:14px; padding: 8px 6px; text-align:center; -moz-appearance:textfield;
  }
  .field input:focus{ outline:none; border-color: var(--brass); }
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field-label{ position:absolute; top:-8px; left:6px; background:var(--surface); padding:0 4px; font-size:8.5px; color:var(--muted-2); letter-spacing:0.5px;}

  .set-remove-slot{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--rust); color: var(--rust);
    background:none; font-size:14px; line-height:1; cursor:pointer; display:flex;
    align-items:center; justify-content:center; visibility:hidden; padding:0;
  }
  #log-view.editing .set-remove-slot{ visibility:visible; }
  .set-remove-slot:active{ background: var(--rust); color: var(--bg); }

  .edit-only{ display:none; }
  #log-view.editing .edit-only{ display:block; }

  .add-set-btn{
    width: calc(100% - 32px); margin: 10px 16px 14px;
    background: none; border:1px dashed var(--border); color: var(--muted);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px;
    padding:10px; border-radius:8px; cursor:pointer; text-transform:uppercase;
  }
  .add-set-btn:active{ border-color: var(--brass); color: var(--brass); }

  .add-exercise-btn{
    width:100%; margin: 4px 0 20px;
    background: none; border:1px dashed var(--brass-dim); color: var(--brass);
    font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; letter-spacing:1.5px;
    padding:14px; border-radius:10px; cursor:pointer; text-transform:uppercase;
  }
  .add-exercise-btn:active{ background: var(--brass-dim); color:#1B1D21; }

  .up-arrow{ color: var(--teal); font-size: 11px; margin-left: 3px; }

  .finish-bar{
    position: sticky; bottom:0; z-index: 20;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  .finish-btn{
    width:100%; background: var(--brass); color: #1B1D21; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; font-size:15px; padding: 16px; border-radius: 10px;
    cursor:pointer;
  }
  .finish-btn:active{ background: var(--brass-dim); }

  /* ---------- rest timer bar ---------- */
  .rest-bar{
    position: sticky; bottom:0; z-index: 25;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
  }
  .rest-info{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .rest-label{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:2px; font-size:12px;
    color: var(--muted); text-transform:uppercase;
  }
  .rest-clock{
    font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;
    font-size:28px; font-weight:600; color: var(--chalk); letter-spacing:1px;
  }
  .rest-bar.ending .rest-clock{ color: var(--rust); }
  .rest-progress{
    height:6px; border-radius:3px; background: var(--surface-2); overflow:hidden; margin-bottom:12px;
    border: 1px solid var(--border);
  }
  .rest-progress-fill{
    height:100%; background: var(--brass); width:100%;
    transition: width 1s linear;
  }
  .rest-bar.ending .rest-progress-fill{ background: var(--rust); }
  .rest-controls{ display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap:8px; }
  .rest-controls button{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.5px; font-size:13px;
    border-radius:8px; padding:12px 6px; cursor:pointer; border:1px solid var(--border);
    background: var(--surface-2); color: var(--chalk);
  }
  .rest-controls button:active{ background: var(--border); }
  .rest-controls .rest-skip{ background: var(--brass); color:#1B1D21; border-color: var(--brass); }
  .rest-controls .rest-skip:active{ background: var(--brass-dim); }

  .toast{
    position: fixed; left:50%; bottom: 90px; transform: translateX(-50%);
    background: var(--surface-2); border:1px solid var(--teal); color: var(--chalk);
    padding: 12px 18px; border-radius: 8px; font-size:13px; z-index:50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    animation: toastIn 0.2s ease;
    max-width: 85%; text-align:center;
  }
  @keyframes toastIn{ from{ opacity:0; transform: translateX(-50%) translateY(8px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }

  .empty-note{ color: var(--muted); font-size:12px; text-align:center; padding: 20px 20px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-card{
    background: var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px; width:100%; max-width:360px;
  }
  .modal-title{
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; font-size:14px;
    color: var(--brass); text-transform:uppercase; margin-bottom:16px;
  }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{
    display:block; font-size:10px; color: var(--muted); text-transform:uppercase;
    letter-spacing:0.5px; margin-bottom:5px;
  }
  .modal-field input{
    width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:6px;
    color: var(--chalk); font-family:'IBM Plex Mono',monospace; font-size:14px; padding:10px;
  }
  .modal-field input:focus{ outline:none; border-color: var(--brass); }
  .modal-row{ display:flex; gap:10px; }
  .modal-row .modal-field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px; font-size:13px;
    padding:12px; border-radius:8px; cursor:pointer; text-transform:uppercase;
    border:1px solid var(--border); background: var(--surface-2); color: var(--chalk);
  }
  .modal-actions .primary{ background: var(--brass); border-color: var(--brass); color:#1B1D21; }
  .modal-actions .primary:active{ background: var(--brass-dim); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="home-view">
  <div class="topbar">
    <div class="wordmark">
      <span class="bar">&#9473;&#9679;&#9473;</span>
      <h1>Iron Log</h1>
    </div>
    <div class="tagline">30-day upper/lower cycle &middot; progressive overload tracker</div>
  </div>
  <div class="container">
    <div class="section-label">This week's plan</div>
    <div id="day-list"></div>
    <div class="reset-row">
      <button class="reset-btn" id="reset-btn">clear all logged data</button>
      <button class="reset-btn" id="restore-btn">restore original program</button>
    </div>
  </div>
</div>

<div id="log-view" class="hidden">
  <div class="topbar">
    <div class="back-row">
      <button class="back-btn" id="back-btn">&larr; BACK</button>
      <button class="edit-toggle-btn" id="edit-toggle-btn">Edit</button>
    </div>
    <div class="wordmark" style="margin-top:8px;">
      <h1 id="log-title" style="font-size:22px;"></h1>
    </div>
    <div class="tagline" id="log-subtitle"></div>
  </div>
  <div class="container" id="log-body" style="padding-bottom: 100px;"></div>
  <div class="finish-bar" id="finish-bar">
    <button class="finish-btn" id="finish-btn">Finish Workout</button>
  </div>
  <div class="rest-bar hidden" id="rest-bar">
    <div class="rest-info">
      <span class="rest-label">Resting</span>
      <span class="rest-clock" id="rest-clock">01:30</span>
    </div>
    <div class="rest-progress"><div class="rest-progress-fill" id="rest-progress-fill"></div></div>
    <div class="rest-controls">
      <button id="rest-minus">&minus;15s</button>
      <button class="rest-skip" id="rest-skip">Skip Rest</button>
      <button id="rest-plus">+15s</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="add-exercise-modal">
  <div class="modal-card">
    <div class="modal-title">Add Exercise</div>
    <div class="modal-field">
      <label>Name</label>
      <input type="text" id="modal-name" placeholder="e.g. Incline DB Curl">
    </div>
    <div class="modal-field">
      <label>Notes (optional)</label>
      <input type="text" id="modal-notes" placeholder="e.g. Alternate sides each rep">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Target reps</label>
        <input type="text" id="modal-target" value="10">
      </div>
      <div class="modal-field">
        <label># Sets</label>
        <input type="number" id="modal-sets" min="1" max="8" value="3">
      </div>
    </div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-save" class="primary">Add</button>
    </div>
  </div>
</div>

<script>

type": "normal", "target": "8"}]}, {"name": "Standing Loaded Dumbbell Calf Raise", "notes": "Hold a dumbbell in each hand", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Weighted Dumbbell Sit-Up", "notes": "Hold dumbbell at chest", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}]}, {"id": "d3", "num": 3, "title": "UPPER B", "subtitle": "Pull/Push, Back Emphasis", "exercises": [{"name": "Incline Dumbbell Row", "notes": "Chest-supported if possible", "superset": "", "sets": [{"type": "warmup", "target": "15"}, {"type": "warmup", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Incline Dumbbell Bench Press", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Pullover", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}]}, {"name": "Bent-Over Dumbbell Rear Delt Fly", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Seated Dumbbell Lateral Raise", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Incline Dumbbell Hammer Curl", "notes": "", "superset": "d3_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Dumbbell Skull Crusher", "notes": "", "superset": "d3_arms", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}]}, {"id": "d4", "num": 4, "title": "LOWER B", "subtitle": "Hamstring/Glute Emphasis", "exercises": [{"name": "Single-Leg Dumbbell Romanian Deadlift", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "warmup", "target": "12"}, {"type": "warmup", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Bulgarian Split Squat", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Dumbbell Hip Thrust", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Seated Loaded Dumbbell Calf Raise", "notes": "Hold a dumbbell on each knee", "superset": "", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}, {"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Weighted Plank", "notes": "Plate or dumbbell on back", "superset": "", "sets": [{"type": "normal", "target": "30-45 sec"}, {"type": "normal", "target": "30-45 sec"}, {"type": "normal", "target": "30-45 sec"}]}]}, {"id": "d5", "num": 5, "title": "ARMS + WEAK POINTS", "subtitle": "", "exercises": [{"name": "Alternate Dumbbell Curl", "notes": "Alternate sides each rep", "superset": "", "sets": [{"type": "warmup", "target": "12"}, {"type": "warmup", "target": "10"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}, {"type": "normal", "target": "6"}]}, {"name": "Two-Hand Overhead Dumbbell Triceps Extension", "notes": "", "superset": "", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "10"}, {"type": "normal", "target": "8"}]}, {"name": "Cross-Body Hammer Curl", "notes": "Alternate sides each rep", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "10"}, {"type": "normal", "target": "10"}]}, {"name": "Dumbbell Kickback", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "12"}, {"type": "normal", "target": "12"}]}, {"name": "Bent-Over Dumbbell Rear Delt Fly", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}]}, {"name": "Dumbbell Lateral Raise", "notes": "", "superset": "d5_finisher", "sets": [{"type": "normal", "target": "15"}, {"type": "normal", "target": "15"}]}, {"name": "Weighted Russian Twist", "notes": "Hold dumbbell with both hands", "superset": "", "sets": [{"type": "normal", "target": "15-20"}, {"type": "normal", "target": "15-20"}, {"type": "normal", "target": "15-20"}]}]}];

let currentDay = null;
let cachedLatest = null;
let editMode = false;

function isTimeTarget(t){ return /sec/i.test(t); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function slug(str){
  return String(str).toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 24);
}

function ensureIds(days){
  days.forEach(day => {
    day.exercises.forEach((ex, i) => {
      if(!ex.id) ex.id = day.id + '-ex' + i + '-' + slug(ex.name);
      ex.sets.forEach((s, j) => {
        if(!s.id) s.id = ex.id + '-set' + j;
      });
    });
  });
}

function saveProgram(program){
  try{ localStorage.setItem('program-data', JSON.stringify(program)); }catch(e){}
}

function loadProgram(){
  try{
    const raw = localStorage.getItem('program-data');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const cloned = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
  ensureIds(cloned);
  saveProgram(cloned);
  return cloned;
}

let LIVE_PROGRAM = loadProgram();

async function getLatest(dayId){
  try{
    const raw = localStorage.getItem('latest:' + dayId);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function fmtDate(iso){
  const d = new Date(iso);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

async function renderHome(){
  const list = document.getElementById('day-list');
  list.innerHTML = '';
  for(const day of LIVE_PROGRAM){
    const latest = await getLatest(day.id);
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="num">${String(day.num).padStart(2,'0')}</div>
      <div class="info">
        <div class="title">${escapeHtml(day.title)}</div>
        <div class="subtitle">${escapeHtml(day.subtitle || '')}</div>
        <div class="status ${latest ? 'done' : ''}">${latest ? 'Last done ' + fmtDate(latest.date) : 'Not started yet'}</div>
      </div>
      <div class="chevron">&rsaquo;</div>
    `;
    card.addEventListener('click', () => openDay(day.id));
    list.appendChild(card);
  }
}

async function openDay(dayId){
  endRest();
  currentDay = LIVE_PROGRAM.find(d => d.id === dayId);
  cachedLatest = await getLatest(dayId);
  document.getElementById('log-title').textContent = currentDay.title;
  document.getElementById('log-subtitle').textContent = currentDay.subtitle
    ? currentDay.subtitle + (cachedLatest ? ' · last done ' + fmtDate(cachedLatest.date) : '')
    : (cachedLatest ? 'Last done ' + fmtDate(cachedLatest.date) : 'Not started yet');

  editMode = false;
  document.getElementById('log-view').classList.remove('editing');
  document.getElementById('edit-toggle-btn').textContent = 'Edit';

  renderDayBody();

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('log-view').classList.remove('hidden');
  window.scrollTo(0,0);
}

function computeRestSeconds(ex, setType){
  // supersets: minimal rest, since exercises are meant to be done back-to-back
  if(ex.superset) return 20;
  // warm-up sets: short rest, you're not near failure yet
  if(setType === 'warmup') return 60;
  // the day's first exercise is the primary heavy compound lift: longer rest
  if(currentDay && currentDay.exercises[0] && currentDay.exercises[0].id === ex.id) return 120;
  // everything else: standard hypertrophy-accessory rest
  return 75;
}

function renderExerciseBlock(ex, latest){
  const block = document.createElement('div');
  block.className = 'exercise-block';
  block.dataset.exId = ex.id;

  const head = document.createElement('div');
  head.className = 'exercise-head';
  head.innerHTML = `
    <div class="exercise-name-row">
      <div class="exercise-name">${escapeHtml(ex.name)}${ex.superset ? `<span class="superset-tag">SUPERSET</span>` : ''}</div>
      <button class="remove-exercise-btn" title="Remove exercise">&times;</button>
    </div>
    ${ex.notes ? `<div class="exercise-note">${escapeHtml(ex.notes)}</div>` : ''}
    <div class="plate-tally"></div>
  `;
  block.appendChild(head);
  head.querySelector('.remove-exercise-btn').addEventListener('click', () => removeExercise(ex.id));

  const tally = head.querySelector('.plate-tally');

  ex.sets.forEach((s, setIdx) => {
    const prevSet = latest && latest.exercises && latest.exercises[ex.id] ? latest.exercises[ex.id][s.id] : null;
    const row = document.createElement('div');
    row.className = 'set-row';
    row.dataset.setId = s.id;
    const label = s.type === 'warmup' ? 'Warm-up' : `Set ${ex.sets.slice(0, setIdx+1).filter(x => x.type !== 'warmup').length}`;
    const timeBased = isTimeTarget(s.target);
    const secondLabel = timeBased ? 'SEC' : 'REPS';
    const restSeconds = computeRestSeconds(ex, s.type);
    row.innerHTML = `
      <div class="set-label ${s.type === 'warmup' ? 'warmup' : ''}">${label}</div>
      <div class="target">target: <span class="num">${escapeHtml(s.target)}</span></div>
      <div class="field">
        <span class="field-label">LB</span>
        <input type="number" inputmode="decimal" min="0" step="0.5"
               data-field="weight"
               placeholder="${prevSet && prevSet.weight != null ? prevSet.weight : '-'}">
      </div>
      <div class="field">
        <span class="field-label">${secondLabel}</span>
        <input type="number" inputmode="numeric" min="0" step="1"
               data-field="reps"
               placeholder="${prevSet && prevSet.reps != null ? prevSet.reps : '-'}">
      </div>
      <button class="set-remove-slot" title="Remove set">&minus;</button>
    `;
    block.appendChild(row);

    const seg = document.createElement('div');
    seg.className = 'plate-seg';
    tally.appendChild(seg);

    const weightInput = row.querySelector('[data-field="weight"]');
    const repsInput = row.querySelector('[data-field="reps"]');
    [weightInput, repsInput].forEach(inp => {
      inp.addEventListener('input', () => updateTally(block));
    });
    repsInput.addEventListener('change', () => {
      if(repsInput.value !== ''){ startRest(restSeconds); }
    });
    row.querySelector('.set-remove-slot').addEventListener('click', () => removeSet(ex.id, s.id));
  });

  const addSetBtn = document.createElement('button');
  addSetBtn.className = 'add-set-btn edit-only';
  addSetBtn.textContent = '+ Add Set';
  addSetBtn.addEventListener('click', () => addSet(ex.id));
  block.appendChild(addSetBtn);

  return block;
}

function renderDayBody(){
  const body = document.getElementById('log-body');
  body.innerHTML = '';

  if(currentDay.exercises.length === 0){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No exercises in this day yet — tap Edit, then + Add Exercise.';
    body.appendChild(note);
  }else{
    currentDay.exercises.forEach(ex => {
      body.appendChild(renderExerciseBlock(ex, cachedLatest));
    });
  }

  const addExBtn = document.createElement('button');
  addExBtn.className = 'add-exercise-btn edit-only';
  addExBtn.textContent = '+ Add Exercise';
  addExBtn.addEventListener('click', openAddExerciseModal);
  body.appendChild(addExBtn);
}

function snapshotInputs(){
  const snap = {};
  document.querySelectorAll('#log-body .exercise-block').forEach(block => {
    const exId = block.dataset.exId;
    block.querySelectorAll('.set-row').forEach(row => {
      const setId = row.dataset.setId;
      const w = row.querySelector('[data-field="weight"]').value;
      const r = row.querySelector('[data-field="reps"]').value;
      if(w !== '' || r !== ''){
        snap[exId + '|' + setId] = { w, r };
      }
    });
  });
  return snap;
}

function restoreInputs(snap){
  document.querySelectorAll('#log-body .exercise-block').forEach(block => {
    const exId = block.dataset.exId;
    block.querySelectorAll('.set-row').forEach(row => {
      const setId = row.dataset.setId;
      const key = exId + '|' + setId;
      if(snap[key]){
        row.querySelector('[data-field="weight"]').value = snap[key].w;
        row.querySelector('[data-field="reps"]').value = snap[key].r;
      }
    });
    updateTally(block);
  });
}

function rebuildDayBody(){
  const snap = snapshotInputs();
  renderDayBody();
  restoreInputs(snap);
}

function updateTally(block){
  const rows = block.querySelectorAll('.set-row');
  const segs = block.querySelectorAll('.plate-seg');
  rows.forEach((row, i) => {
    const w = row.querySelector('[data-field="weight"]').value;
    const r = row.querySelector('[data-field="reps"]').value;
    if(segs[i]){
      if(w !== '' || r !== ''){ segs[i].classList.add('filled'); }
      else{ segs[i].classList.remove('filled'); }
    }
  });
}

/* ---------- structural editing ---------- */
function toggleEdit(){
  editMode = !editMode;
  document.getElementById('log-view').classList.toggle('editing', editMode);
  document.getElementById('edit-toggle-btn').textContent = editMode ? 'Done' : 'Edit';
}

function addSet(exId){
  const ex = currentDay.exercises.find(e => e.id === exId);
  if(!ex) return;
  const last = ex.sets[ex.sets.length - 1];
  const newSet = { type: 'normal', target: last ? last.target : '10', id: exId + '-set-' + Date.now() };
  ex.sets.push(newSet);
  saveProgram(LIVE_PROGRAM);
  rebuildDayBody();
}

function removeSet(exId, setId){
  const ex = currentDay.exercises.find(e => e.id === exId);
  if(!ex) return;
  if(ex.sets.length <= 1){
    showToast('Needs at least 1 set — remove the exercise instead.');
    return;
  }
  ex.sets = ex.sets.filter(s => s.id !== setId);
  saveProgram(LIVE_PROGRAM);
  rebuildDayBody();
}

function removeExercise(exId){
  if(!confirm('Remove this exercise from the day?')) return;
  currentDay.exercises = currentDay.exercises.filter(e => e.id !== exId);
  saveProgram(LIVE_PROGRAM);
  rebuildDayBody();
  showToast('Exercise removed.');
}

function openAddExerciseModal(){
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-notes').value = '';
  document.getElementById('modal-target').value = '10';
  document.getElementById('modal-sets').value = '3';
  document.getElementById('add-exercise-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-name').focus(), 50);
}

function closeAddExerciseModal(){
  document.getElementById('add-exercise-modal').classList.add('hidden');
}

function handleAddExercise(){
  const name = document.getElementById('modal-name').value.trim();
  if(!name){ showToast('Enter an exercise name.'); return; }
  const notes = document.getElementById('modal-notes').value.trim();
  const target = document.getElementById('modal-target').value.trim() || '10';
  let setCount = parseInt(document.getElementById('modal-sets').value, 10);
  if(!setCount || setCount < 1) setCount = 1;
  if(setCount > 8) setCount = 8;

  const exId = currentDay.id + '-custom-' + Date.now();
  const sets = [];
  for(let i = 0; i < setCount; i++){
    sets.push({ type: 'normal', target, id: exId + '-set' + i });
  }
  currentDay.exercises.push({ id: exId, name, notes, superset: '', sets });
  saveProgram(LIVE_PROGRAM);
  closeAddExerciseModal();
  rebuildDayBody();
  showToast('Exercise added.');
}

document.getElementById('edit-toggle-btn').addEventListener('click', toggleEdit);
document.getElementById('modal-cancel').addEventListener('click', closeAddExerciseModal);
document.getElementById('modal-save').addEventListener('click', handleAddExercise);

/* ---------- rest timer ---------- */
let restInterval = null;
let restRemaining = 0;
let restTotal = 0;

function startRest(seconds){
  clearInterval(restInterval);
  restTotal = seconds;
  restRemaining = seconds;
  document.getElementById('finish-bar').classList.add('hidden');
  const bar = document.getElementById('rest-bar');
  bar.classList.remove('hidden');
  bar.classList.remove('ending');
  updateRestUI();
  restInterval = setInterval(() => {
    restRemaining--;
    if(restRemaining <= 0){
      clearInterval(restInterval);
      restRemaining = 0;
      updateRestUI();
      onRestComplete();
      return;
    }
    updateRestUI();
  }, 1000);
}

function updateRestUI(){
  const m = Math.floor(restRemaining / 60).toString().padStart(2,'0');
  const s = (restRemaining % 60).toString().padStart(2,'0');
  document.getElementById('rest-clock').textContent = `${m}:${s}`;
  const pct = restTotal > 0 ? Math.min(100, (restRemaining / restTotal) * 100) : 0;
  document.getElementById('rest-progress-fill').style.width = pct + '%';
  document.getElementById('rest-bar').classList.toggle('ending', restRemaining > 0 && restRemaining <= 5);
}

function endRest(){
  clearInterval(restInterval);
  restInterval = null;
  document.getElementById('rest-bar').classList.add('hidden');
  document.getElementById('finish-bar').classList.remove('hidden');
}

function onRestComplete(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  playBeep();
  setTimeout(endRest, 1400);
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ring = (delay) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.32);
      }, delay);
    };
    ring(0); ring(400);
  }catch(e){}
}

document.getElementById('rest-skip').addEventListener('click', endRest);
document.getElementById('rest-minus').addEventListener('click', () => {
  restRemaining = Math.max(0, restRemaining - 15);
  if(restRemaining === 0){ clearInterval(restInterval); onRestComplete(); }
  else{ updateRestUI(); }
});
document.getElementById('rest-plus').addEventListener('click', () => {
  restRemaining += 15;
  updateRestUI();
});

async function finishWorkout(){
  const body = document.getElementById('log-body');
  const exercisesData = {};
  let anyData = false;

  currentDay.exercises.forEach(ex => {
    const block = body.querySelector(`.exercise-block[data-ex-id="${ex.id}"]`);
    if(!block) return;
    const setsData = {};
    ex.sets.forEach(s => {
      const row = block.querySelector(`.set-row[data-set-id="${s.id}"]`);
      if(!row) return;
      const wInput = row.querySelector('[data-field="weight"]');
      const rInput = row.querySelector('[data-field="reps"]');
      const weight = wInput.value !== '' ? parseFloat(wInput.value) : null;
      const reps = rInput.value !== '' ? parseFloat(rInput.value) : null;
      if(weight != null || reps != null) anyData = true;
      setsData[s.id] = { weight, reps };
    });
    exercisesData[ex.id] = setsData;
  });

  if(!anyData){
    showToast('Enter at least one set before finishing.');
    return;
  }

  const payload = { date: new Date().toISOString(), exercises: exercisesData };
  try{
    localStorage.setItem('latest:' + currentDay.id, JSON.stringify(payload));
    showToast('Workout saved — nice work.');
    setTimeout(() => { goHome(); }, 650);
  }catch(e){
    showToast('Could not save — try again.');
  }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function goHome(){
  endRest();
  document.getElementById('log-view').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  renderHome();
  window.scrollTo(0,0);
}

document.getElementById('back-btn').addEventListener('click', goHome);
document.getElementById('finish-btn').addEventListener('click', finishWorkout);
document.getElementById('reset-btn').addEventListener('click', () => {
  if(!confirm('Clear all logged sessions? This cannot be undone.')) return;
  for(const day of LIVE_PROGRAM){
    try{ localStorage.removeItem('latest:' + day.id); }catch(e){}
  }
  showToast('All data cleared.');
  renderHome();
});
document.getElementById('restore-btn').addEventListener('click', () => {
  if(!confirm('Restore the original 5-day program? Any exercises or sets you added or removed will be lost. Logged weights are kept.')) return;
  LIVE_PROGRAM = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
  ensureIds(LIVE_PROGRAM);
  saveProgram(LIVE_PROGRAM);
  showToast('Program restored to original.');
  renderHome();
});

renderHome();
</script>
